[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "state-geometry-video"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "Pillow>=10",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

